@font-face{font-family:LMRI;src:url('file:///usr/share/texmf/fonts/opentype/public/lm/lmroman10-italic.otf')}

html,body{margin:0;background:#000}

<canvas id="c" width="1080" height="1080"></canvas>
<script>
const W=1080,H=1080,FPS=+(new URLSearchParams(location.search).get('fps')||60),DT=1/FPS;
const cv=document.getElementById('c'),g=cv.getContext('2d');
// deterministic random
let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const NEON=['#3ff0ff','#ff3fb4','#a6ff3f','#ff8a3d','#a774ff','#4f7dff','#ffd23f'];
const INK='#d9d3c3',DIM='#8f8878',RULE='#3a362d';
const SERIF='LMR',IT='LMRI',MONO='DejaVu Sans Mono';

// ---------------- document layout (document coordinates) ----------------
const T=[];          // tokens
const ROWS=[];       // table rows
let docH=0;
function tok(text,x,y,size,font,col,kind='w'){const o={text,x,y,size,font,col,kind,w:0,h:size*1.15,fx:null};g.font=`${size}px ${font}`;o.w=kind==='v'?varW(text,size):g.measureText(text).width;T.push(o);return o;}
// variable like "2V5": superscript iteration on the left, V, subscript index
function varW(s,size){const m=s.match(/^(\d+)V(\d+)$/);g.font=`${size*0.55}px ${SERIF}`;const a=g.measureText(m[1]).width,c=g.measureText(m[2]).width;g.font=`${size}px ${IT}`;return a+g.measureText('V').width+c+2;}
function drawVar(s,x,y,size,font,col){const m=s.match(/^(\d+)V(\d+)$/);const R=font===CHIP;const small=R?CHIP:(font===MONO?MONO:SERIF);
  g.fillStyle=col;g.font=fnt(small,size*0.55);g.fillText(m[1],x,y-size*0.42);let a=g.measureText(m[1]).width;
  g.font=R?fnt(CHIP,size):`${size}px ${font===MONO?MONO:IT}`;g.fillText('V',x+a,y);const v=g.measureText('V').width;g.font=fnt(small,size*0.55);g.fillText(m[2],x+a+v+1,y+size*0.22);}
function flow(text,x0,y0,maxW,size,lh,font,col,units){ // word-wrap; units = phrases kept together
  let x=x0,y=y0;const parts=units||text.split(' ');
  for(const p of parts){g.font=`${size}px ${font}`;const w=g.measureText(p).width;if(x+w>x0+maxW){x=x0;y+=lh;}const t=tok(p,x,y,size,font,col);x+=w+g.measureText(' ').width;}
  return y+lh;}
function build(){
  let y=110;
  tok('NOTE G.',W/2-92,y,52,'LMRB',INK);y+=52;
  tok('Notes by the Translator',W/2-205,y,26,IT,DIM);tok('·',W/2+70,y,26,SERIF,DIM);tok('A. A. L.',W/2+92,y,26,IT,DIM);tok('1843',W/2+205,y,26,SERIF,DIM);
  y+=86;
  const S=34,LH=56,X=70,MW=940;
  y=flow('',X,y,MW,S,LH,SERIF,INK,['It is','desirable','to guard','against the','possibility','of exaggerated','ideas that','might arise','as to the','powers of','the Analytical','Engine.'])+24;
  const u2=['The','Analytical','Engine has','no pretensions whatever to originate anything.','It can do','whatever we','know how','to order it','to perform.','It can','follow analysis;','but it has','no power','of anticipating','any analytical','relations','or truths.'];
  y=flow('',X,y,MW,S,LH,SERIF,INK,u2)+24;
  y=flow('',X,y,MW,S,LH,SERIF,INK,['We will','terminate','these Notes','by following up','in detail','the steps','through which','the engine','could compute','the Numbers','of Bernoulli.'])+40;
  tok('Diagram for the computation by the Engine',X+70,y,30,IT,INK);y+=42;tok('of the Numbers of Bernoulli.',X+230,y,30,IT,INK);y+=40;
  // table
  const C=[70,150,240,520,730,1010];
  const TH=y; const heads=[['No.'],['Op.'],['Variables','acted upon.'],['Variables','receiving results.'],['Statement','of Results.']];
  heads.forEach((h,i)=>h.forEach((l,j)=>tok(l,C[i]+10,TH+28+j*24,19,IT,DIM)));
  y=TH+70;
  const DATA=[['×','1V2 × 1V3','1V4, 1V5, 1V6','= 2n'],['−','1V4 − 1V1','2V4','= 2n − 1'],['+','1V5 + 1V1','2V5','= 2n + 1'],['÷','2V5 ÷ 2V4','1V11','= (2n − 1) / (2n + 1)'],['÷','1V11 ÷ 1V2','2V11','= ½ · (2n − 1)/(2n + 1)'],['−','0V13 − 2V11','1V13','= A0'],['−','1V3 − 1V1','1V10','= n − 1'],['+','1V2 + 0V7','1V7','= 2 + 0 = 2'],['÷','1V6 ÷ 1V7','3V11','= 2n / 2 = A1'],['×','1V21 × 3V11','1V12','= B1A1'],['+','1V12 + 1V13','2V13','= A0 + B1A1'],['−','1V10 − 1V1','2V10','= n − 2'],['−','1V6 − 1V1','2V6','= 2n − 1'],['+','1V1 + 1V7','2V7','= 2 + 1 = 3'],['÷','2V6 ÷ 2V7','1V8','= (2n − 1) / 3'],['×','1V8 × 3V11','4V11','= 2n/2 · (2n − 1)/3'],['−','2V6 − 1V1','3V6','= 2n − 2'],['+','1V1 + 2V7','3V7','= 3 + 1 = 4'],['÷','3V6 ÷ 3V7','1V9','= (2n − 2) / 4'],['×','1V9 × 4V11','5V11','= A3'],['×','1V22 × 5V11','0V12','= B3A3'],['+','2V12 + 2V13','3V13','= A0 + B1A1 + B3A3'],['−','2V10 − 1V1','3V10','= n − 3'],['+','4V13 + 0V24','1V24','= B7'],['+','1V1 + 1V3','1V3','= n + 1']];
  const RH=52,FS=27;
  DATA.forEach((r,i)=>{const yy=y+i*RH,base=yy+RH*0.68;const row={i:i+1,y:yy,h:RH,state:'',toks:{}};
    row.toks.n=tok(String(i+1),C[0]+(i+1<10?40:26),base,FS,SERIF,DIM);
    row.toks.op=tok(r[0],C[1]+30,base,FS+4,SERIF,INK,'op');
    let x=C[2]+12;row.toks.a=[];for(const p of r[1].split(' ')){const isV=/^\d+V\d+$/.test(p);const t=tok(p,x,base,FS,SERIF,INK,isV?'v':'w');row.toks.a.push(t);x+=t.w+10;}
    x=C[3]+12;for(const p of r[2].split(' ')){const q=p.replace(',','');const t=tok(q,x,base,FS,SERIF,INK,'v');x+=t.w+(p.endsWith(',')?18:10);if(p.endsWith(','))tok(',',x-16,base,FS,SERIF,INK);}
    tok(r[3],C[4]+12,base,FS-3,SERIF,INK);
    ROWS.push(row);});
  docH=y+DATA.length*RH+180;
  window.TABLE={C,TH,top:y,RH};
}

// ---------------- the fly (top-down neon line drawing with IK legs) ----------------
const fly={x:0,y:0,a:Math.PI/2,feet:[],flying:0,carry:null};
const SC=1.4;const LEGS=[[22,-1,52,-20],[4,-1,66,0],[-14,-1,56,22],[22,1,52,-20],[4,1,66,0],[-14,1,56,22]].map(l=>[l[0]*SC,l[1],l[2]*SC,l[3]]); // hip x, side, reach, angle offset deg
function legIdeal(i){const[hx,s,r,off]=LEGS[i];const ang=fly.a+s*(Math.PI/2)+s*off*Math.PI/180*-1;const hip=bodyPt(hx,s*8*SC);return{x:hip.x+Math.cos(ang)*r+Math.cos(fly.a)*14*SC,y:hip.y+Math.sin(ang)*r+Math.sin(fly.a)*14*SC,hip};}
function bodyPt(fx,fy){const c=Math.cos(fly.a),s=Math.sin(fly.a);return{x:fly.x+fx*c-fy*s,y:fly.y+fx*s+fy*c};}
function initFeet(){fly.feet=LEGS.map((_,i)=>{const p=legIdeal(i);return{x:p.x,y:p.y,from:null,to:null,t:1};});}
function updateFeet(onLand){let stepping=fly.feet.filter(f=>f.t<1).length;
  fly.feet.forEach((f,i)=>{const id=legIdeal(i);
    if(f.t<1){f.t=Math.min(1,f.t+DT/0.06);const u=f.t;f.x=f.from.x+(f.to.x-f.from.x)*u;f.y=f.from.y+(f.to.y-f.from.y)*u;if(f.t>=1)onLand(f.x,f.y);return;}
    const d=Math.hypot(id.x-f.x,id.y-f.y);
    if(!fly.flying&&((d>34*SC&&stepping<3&&((i%2)===(Math.floor(clock*16)%2)))||d>70*SC)){f.from={x:f.x,y:f.y};f.to={x:id.x+(id.x-f.x)*0.35,y:id.y+(id.y-f.y)*0.35};f.t=0;stepping++;}
    if(fly.flying){f.x+=(id.x-f.x)*0.5;f.y+=(id.y-f.y)*0.5;}});}
function drawFly(cam){
  const P=p=>({x:p.x,y:p.y-cam});const c1='#3ff0ff',jc='#ff3fb4';
  g.lineCap='round';g.lineJoin='round';
  // legs (tucked when flying)
  fly.feet.forEach((f,i)=>{const id=legIdeal(i),hip=P(id.hip);let ft=P(f);
    if(fly.flying){const b=bodyPt(LEGS[i][0]-10,LEGS[i][1]*14);ft=P(b);}
    const mx=(hip.x+ft.x)/2,my=(hip.y+ft.y)/2,dx=ft.x-hip.x,dy=ft.y-hip.y,L=Math.hypot(dx,dy)||1,bend=fly.flying?6:Math.max(0,40-L*0.35);
    const s=LEGS[i][1];const kx=mx-dy/L*bend*s,ky=my+dx/L*bend*s;
    g.strokeStyle=c1;g.lineWidth=2.6;g.beginPath();g.moveTo(hip.x,hip.y);g.lineTo(kx,ky);g.lineTo(ft.x,ft.y);g.stroke();
    g.fillStyle=jc;for(const q of[[kx,ky],[ft.x,ft.y]]){g.beginPath();g.arc(q[0],q[1],4.2,0,7);g.fill();}});
  const ctr=P(fly);g.save();g.translate(ctr.x,ctr.y);g.rotate(fly.a);g.scale(SC,SC);g.lineWidth=2.6/SC;
  // wings
  const flap=fly.flying?Math.sin(clock*90)*0.5:0;
  for(const s of[-1,1]){g.save();g.rotate(s*(0.42+flap));g.fillStyle=fly.flying?'rgba(63,240,255,.10)':'rgba(63,240,255,.06)';g.strokeStyle='rgba(63,240,255,.85)';g.lineWidth=2;
    g.beginPath();g.ellipse(-34,s*14,46,15,0,0,7);g.fill();g.stroke();
    g.strokeStyle='rgba(63,240,255,.35)';g.lineWidth=1.2;for(const k of[-0.5,0,0.5]){g.beginPath();g.moveTo(-6,s*12);g.quadraticCurveTo(-34,s*(14+k*16),-76,s*(14+k*10));g.stroke();}g.restore();}
  g.strokeStyle=c1;g.lineWidth=2.6;
  g.beginPath();g.ellipse(-26,0,24,13,0,0,7);g.stroke();for(let k=-42;k<-8;k+=8){g.beginPath();g.moveTo(k,-11);g.lineTo(k,11);g.stroke();}
  g.beginPath();g.ellipse(4,0,14,12,0,0,7);g.stroke();
  g.beginPath();g.arc(23,0,8,0,7);g.stroke();
  g.fillStyle='#ff2a3c';g.shadowColor='#ff2a3c';g.shadowBlur=10;for(const s of[-1,1]){g.beginPath();g.ellipse(26,s*7,6,5,0,0,7);g.fill();}g.shadowBlur=0;
  g.fillStyle='#fff';g.beginPath();g.arc(4,0,3.5,0,7);g.fill();
  g.restore();}


const CHIP='Poppins';
const fnt=(font,size)=>font===CHIP?`600 ${size}px Poppins`:`${size}px ${font}`;
function hexMix(h,w){const n=parseInt(h.slice(1),16),r=n>>16,gg=(n>>8)&255,b=n&255;const m=c=>Math.round(c+(w>0?(255-c)*w:c*w));return`rgb(${m(r)},${m(gg)},${m(b)})`;}
function pillPath(x,y,w,h){const r=Math.min(h/2,w/2);g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function pill(x,y,w,h,col,alpha=1){g.save();g.globalAlpha*=alpha;
  pillPath(x,y,w,h);g.shadowColor='rgba(0,0,0,.6)';g.shadowBlur=16;g.shadowOffsetY=6;
  const gr=g.createLinearGradient(0,y,0,y+h);gr.addColorStop(0,hexMix(col,0.45));gr.addColorStop(0.5,col);gr.addColorStop(1,hexMix(col,-0.35));g.fillStyle=gr;g.fill();
  g.shadowColor=col;g.shadowBlur=22;g.shadowOffsetY=0;g.globalAlpha*=0.35;g.fill();g.globalAlpha/=0.35;g.shadowBlur=0;
  g.save();pillPath(x,y,w,h);g.clip();const gl=g.createLinearGradient(0,y,0,y+h*0.55);gl.addColorStop(0,'rgba(255,255,255,.55)');gl.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gl;
  g.beginPath();g.ellipse(x+w/2,y+h*0.12,w*0.48,h*0.42,0,0,7);g.fill();g.restore();
  pillPath(x+0.75,y+0.75,w-1.5,h-1.5);g.strokeStyle='rgba(255,255,255,.4)';g.lineWidth=1.3;g.stroke();g.restore();}
function ring(x,y,w,h,col){g.save();pillPath(x,y,w,h);g.fillStyle=col;g.globalAlpha=0.13;g.fill();g.globalAlpha=1;g.shadowColor=col;g.shadowBlur=14;g.strokeStyle=col;g.lineWidth=3;g.stroke();g.shadowBlur=0;g.restore();}

// ---------------- infection effects (the spider's 7 moves) ----------------
const EFF=['bg','bg','outline','color','big','tiny','float','float','hole'];
window.EV=[];function infect(t,force){ if(t.fx||t.lock)return;EV.push(['i',+clock.toFixed(3)]); const e=force||EFF[Math.floor(rnd()*EFF.length)];const col=NEON[Math.floor(rnd()*NEON.length)];
  t.fx={e,col,t0:clock,mono:rnd()<0.6,dx:0,dy:0,vx:0,vy:0,rot:0,vr:0,sc:1,tsc:e==='big'?1.8+rnd()*1.2:e==='tiny'?0.38:1,trot:0};
  if(e==='float'){t.fx.trot=(rnd()-0.5)*1.8;t.fx.vx=(rnd()-0.5)*40;t.fx.vy=-10-rnd()*30;t.fx.vr=(rnd()-0.5)*0.4;}
  if(e==='big'&&t.w>300)t.fx.tsc=1.3;}
function tokAt(x,y){for(let i=T.length-1;i>=0;i--){const t=T[i];const s=t.fx?t.fx.sc:1;if(x>=t.x-6&&x<=t.x+t.w*s+6&&y>=t.y-t.size&&y<=t.y+t.size*0.35)return t;}return null;}
function drawTok(t,cam){
  const f=t.fx;let x=t.x,y=t.y-cam,col=t.col,font=t.font,size=t.size;
  if(y<-200||y>H+200&&!(f&&f.e==='carried'))return;
  if(!f){paint(t,x,y,col,font,size);return;}
  const age=clock-f.t0,k=Math.min(1,age/0.18);
  if(f.e==='hole'){g.globalAlpha=Math.max(0,1-age/0.3);paint(t,x,y,col,font,size);g.globalAlpha=1;return;}
  f.sc+=(f.tsc-f.sc)*0.2;
  if(f.e==='float'){f.vx*=0.985;f.vy*=0.985;f.dx+=f.vx*DT;f.dy+=f.vy*DT;f.rot+=(f.trot-f.rot)*0.08+f.vr*DT;}
  const mono=CHIP;
  g.save();
  if(f.e==='carried'){const b=bodyPt(f.ox,f.oy);g.translate(b.x,b.y-cam);g.rotate(fly.a+f.rot);g.translate(-t.w*f.sc*0.5,0);}
  else{g.translate(x+f.dx,y+f.dy);g.rotate(f.rot);}
  g.scale(f.sc,f.sc);
  {const fit=Math.min(1,t.w/measure(t,mono,size));size=size*Math.max(0.78,fit);}
  const padX=size*0.42,w=measure(t,mono,size),hh=size*1.32,top=-size*0.98;
  if(f.e==='bg'||f.e==='float'&&f.col!=='#ffd23f'||f.e==='carried'){pill(-padX,top,w+padX*2,hh,f.col,Math.min(1,k*1.2));g.shadowColor='rgba(255,255,255,.35)';g.shadowOffsetY=1;paint(t,0,0,'#0a0b10',mono,size);g.shadowOffsetY=0;g.shadowColor='transparent';}
  else if(f.e==='outline'){ring(-padX,top,w+padX*2,hh,f.col);g.shadowColor=f.col;g.shadowBlur=8;paint(t,0,0,hexMix(f.col,0.25),mono,size);g.shadowBlur=0;}
  else{g.shadowColor=f.col;g.shadowBlur=12;paint(t,0,0,hexMix(f.col,0.15),mono,size);g.shadowBlur=0;}
  g.restore();}
function measure(t,font,size){if(t.kind==='v')return varW(t.text,size)*(font===CHIP?1.12:1);g.font=fnt(font,size);return g.measureText(t.text).width;}
function paint(t,x,y,col,font,size){if(t.kind==='v'){drawVar(t.text,x,y,size,font,col);return;}g.fillStyle=col;g.font=fnt(font,size);g.fillText(t.text,x,y);}

// ---------------- path (document coordinates) ----------------
let KEYS=[];
function buildPath(){
  const grab=T.find(t=>t.text.startsWith('no pretensions'));window.GRAB=grab;
  const K=[];const add=(t,x,y)=>K.push({t,x,y});
  add(0,540,-120);add(0.7,620,140);add(1.3,300,260);
  // prose zigzag
  const prose=T.filter(t=>t.y>240&&t.y<grab.y-5);const ys=[...new Set(prose.map(t=>t.y))];
  let tt=1.3;ys.forEach((yy,i)=>{tt+=0.32;add(tt,540+250*Math.sin(i*1.25+0.6),yy-14);});
  tt+=0.35;add(tt,grab.x+grab.w*0.5,grab.y-14);window.GRAB_T=tt;
  const after=T.filter(t=>t.y>grab.y&&t.y<TABLE.TH);const ys2=[...new Set(after.map(t=>t.y))];
  ys2.forEach((yy,i)=>{tt+=0.36;add(tt,540+250*Math.sin(i*1.25+2),yy-14);});
  window.DROP_T=tt-0.6;
  // table: zigzag every row
  tt+=0.4;add(tt,300,TABLE.top-20);
  for(let r=0;r<25;r++){tt+=0.19;const yy=TABLE.top+r*TABLE.RH+TABLE.RH*0.5;add(tt,560+290*Math.sin(r*0.62+0.4),yy);}
  window.TABLE_END=tt;
  // take off, fly back up to operation 4, land on its division
  const r4=ROWS[3],a=r4.toks.a;const tx=r4.toks.op.x-40,ty=r4.y+r4.h*0.45;
  tt+=0.25;add(tt,700,TABLE.top+24*TABLE.RH-150);tt+=0.55;add(tt,760,ty+160);tt+=0.3;add(tt,tx-60,ty+20);window.LAND_T=tt;add(tt+0.4,tx,ty);add(16.5,tx+2,ty);
  KEYS=K;}
function pathAt(t){let i=KEYS.findIndex((k,j)=>KEYS[j+1]&&t<KEYS[j+1].t);if(i<0)i=KEYS.length-2;
  const k0=KEYS[Math.max(0,i-1)],k1=KEYS[i],k2=KEYS[i+1],k3=KEYS[Math.min(KEYS.length-1,i+2)];const u=Math.max(0,Math.min(1,(t-k1.t)/(k2.t-k1.t)));
  const cr=(a,b,c,d)=>0.5*((2*b)+(-a+c)*u+(2*a-5*b+4*c-d)*u*u+(-a+3*b-3*c+d)*u*u*u);
  return{x:cr(k0.x,k1.x,k2.x,k3.x),y:cr(k0.y,k1.y,k2.y,k3.y)};}

// ---------------- simulation ----------------
let clock=0,cam=0,camV=0,started=false,swapT=null;
function setup(){build();buildPath();const p=pathAt(0);fly.x=p.x;fly.y=p.y;fly.a=Math.PI/2;initFeet();cam=0;}
function step(){
  clock+=DT;const t=clock;
  const p=pathAt(t),q=pathAt(t+0.05);const dx=q.x-p.x,dy=q.y-p.y;
  fly.x=p.x+Math.sin(t*23)*1.5;fly.y=p.y;
  if(Math.hypot(dx,dy)>0.6){const ta=Math.atan2(dy,dx);let d=ta-fly.a;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;fly.a+=d*0.22;}
  fly.flying=(t>TABLE_END+0.1&&t<LAND_T-0.05)?1:0;
  updateFeet((x,y)=>{const tk=tokAt(x,y);if(tk&&!tk.lock&&tk!==GRAB&&!inRow4(tk)&&rnd()<0.85)infect(tk);});
  if(!fly.flying){const tk=tokAt(fly.x,fly.y+6);if(tk&&!tk.lock&&tk!==GRAB&&!inRow4(tk)&&rnd()<0.12)infect(tk);}
  // the carried quote
  if(t>=GRAB_T&&!GRAB.fx){GRAB.fx={e:'carried',col:'#ff3fb4',t0:t,mono:false,dx:0,dy:0,vx:0,vy:0,rot:0,vr:0,sc:1,tsc:1.05,trot:0,ox:-10,oy:0};}
  if(GRAB.fx&&GRAB.fx.e==='carried'){GRAB.fx.rot=Math.sin(t*3)*0.25-0.35;if(t>=DROP_T){const b=bodyPt(-10,0);const f=GRAB.fx;f.e='float';f.dx=b.x-GRAB.x-GRAB.w*0.5*Math.cos(fly.a+f.rot);f.dy=b.y-GRAB.y-GRAB.w*0.5*Math.sin(fly.a+f.rot);f.rot=fly.a+f.rot;f.trot=f.rot+0.2;f.vx=-30;f.vy=-20;f.vr=0.05;}}
  // rows: checked when the fly passes
